
name: Ilk Bulut Testim

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Sunucuya test istegi gonder
        run: |
          python - <<'PY'
          import urllib.request
          import json
          import time

          url = "https://httpbin.org/get?test=bulut"
          baslangic = time.time()

          try:
              with urllib.request.urlopen(
                  url, timeout=15
              ) as response:
                  data = json.loads(
                      response.read().decode()
                  )
                  sure = round(
                      (time.time() - baslangic) * 1000
                  )

                  print("HTTP:", response.status)
                  print("Test:", data["args"]["test"])
                  print("Sure:", sure, "ms")
          except Exception as hata:
              print("Test basarisiz:", hata)
              raise
          PY
